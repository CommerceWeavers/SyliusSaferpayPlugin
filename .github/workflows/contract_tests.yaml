name: Contract tests

on:
    schedule:
        -   cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~
    pull_request:
        paths:
            - "tests/Contract/**"
    push:
        paths:
            - "tests/Contract/**"

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.4"]
                symfony: ["~7.4.0"]
                sylius: ["~2.3.0"]
                mysql: ["8.4"]
                node: ["22.x"]

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=${{ matrix.mysql }}"
            SAFERPAY_TEST_API_URL: "https://test.saferpay.com/api/"
            SAFERPAY_TEST_API_USER: ${{ secrets.SAFERPAY_TEST_API_USER }}
            SAFERPAY_TEST_API_PASSWORD: ${{ secrets.SAFERPAY_TEST_API_PASSWORD }}

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl
                    tools: flex,symfony
                    coverage: none

            -   name: Build test application
                uses: SyliusLabs/BuildTestAppAction@v3.2.0
                with:
                    e2e: "yes"
                    e2e_js: "yes"
                    php_version: "${{ matrix.php }}"
                    symfony_version: "${{ matrix.symfony }}"
                    sylius_version: "${{ matrix.sylius }}"
                    database_version: "${{ matrix.mysql }}"
                    node_version: "${{ matrix.node }}"
                    build_type: "plugin"

            -   name: Install browser drivers
                run: vendor/bin/bdi detect drivers

            -   name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always --testsuite contract
