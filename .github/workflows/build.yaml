name: Build

on:
    push:
        branches-ignore:
            - "dependabot/**"
        paths-ignore:
            - "*.md"
    pull_request:
        paths-ignore:
            - "*.md"
    release:
        types: [created]
    schedule:
        -   cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        strategy:
            fail-fast: false
            matrix:
                include:
                    # lowest supported versions
                    -   php: "8.2"
                        symfony: "~6.4.0"
                        sylius: "~2.0.0"
                        mysql: "8.4"
                        node: "22.x"
                    # highest supported versions
                    -   php: "8.4"
                        symfony: "~7.4.0"
                        sylius: "~2.3.0"
                        mysql: "8.4"
                        node: "22.x"

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=${{ matrix.mysql }}"
            SAFERPAY_TEST_API_URL: "http://localhost:4000/"

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl
                    tools: flex,symfony
                    coverage: none

            -   name: Run Mockoon
                uses: mockoon/cli-action@v2
                with:
                    version: "9"
                    data-file: "./tests/mockoon.json"
                    port: 4000

            -   name: Build test application
                uses: SyliusLabs/BuildTestAppAction@v3.2.0
                with:
                    e2e: "yes"
                    php_version: "${{ matrix.php }}"
                    symfony_version: "${{ matrix.symfony }}"
                    sylius_version: "${{ matrix.sylius }}"
                    database_version: "${{ matrix.mysql }}"
                    node_version: "${{ matrix.node }}"
                    build_type: "plugin"

            -   name: Generate payment encryption key
                run: tests/Application/bin/console sylius:payment:generate-key --env=test --no-interaction

            -   name: Check service definitions
                run: |
                    tests/Application/bin/console lint:container --env=dev
                    tests/Application/bin/console lint:container --env=test

            -   name: Validate Doctrine mapping
                run: tests/Application/bin/console doctrine:schema:validate --skip-sync --env=test

            -   name: Run ECS
                run: vendor/bin/ecs check

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse

            -   name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -   name: Run Behat
                run: vendor/bin/behat --format=progress --colors --strict -vvv --no-interaction

            -   name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs (Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }})"
                    path: etc/build/
                    if-no-files-found: ignore
